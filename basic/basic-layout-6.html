<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Layout 6</title>
    <link rel="stylesheet" href="../style.css">
    <style>
      body {
        display: grid;
        grid-template-columns: 0.75fr 2fr 1fr;
        grid-template-rows: 1.5fr 6fr;
      }

      header {
        grid-column-start: 1;
        grid-column-end: 3;
      }

      nav{
        grid-row-start: 2;
      }

      main {
        grid-column-start: 2;
        grid-row-start: 2;
      }

      footer {
        grid-row: 1/3
      }
      /* Doe hier jouw ding! */
    </style>
  </head>
  <body id="basic-layout-6">
    <header><h1>Basic Layout 6</h1></header>
    <nav><a href="../index.html">Terug naar het overzicht</a></nav>
    <main></main>
    <footer></footer>
  </body>
</html>
